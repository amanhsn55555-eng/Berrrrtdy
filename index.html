<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>بئر النفط • منصتي</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Tajawal', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #f8fafc;
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========== هيدر ========== */
    .oil-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 10px 14px;
      z-index: 999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border-bottom: 2px solid #2dd4bf;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .oil-header h2 {
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .oil-header h2 i {
      color: #2dd4bf;
      font-size: 20px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .referral-badge {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .extra-wells-badge {
      background: rgba(45, 212, 191, 0.15);
      border: 1px solid #2dd4bf;
      color: #2dd4bf;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .extra-wells-badge:active {
      background: rgba(45, 212, 191, 0.3);
    }

    /* ========== عرض الموارد ========== */
    .resources-bar {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      background: rgba(22, 33, 62, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 10px 16px;
      z-index: 998;
      border-bottom: 1px solid rgba(45, 212, 191, 0.2);
      display: flex;
      justify-content: space-around;
    }

    .resource-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 18px;
      border-radius: 50px;
      border: 1px solid rgba(45, 212, 191, 0.2);
      font-weight: 700;
      font-size: 15px;
    }

    .resource-badge.gold i { color: #fbbf24; }
    .resource-badge.oil i { color: #2dd4bf; }

    .resource-badge span {
      font-weight: 800;
      font-size: 15px;
    }

    /* ========== المحتوى الرئيسي ========== */
    .oil-container {
      margin-top: 120px;
      padding: 15px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* بطاقة البئر الأساسي */
    .main-well-card {
      background: linear-gradient(145deg, #0f172a, #1e293b);
      border-radius: 25px;
      padding: 30px 20px;
      margin-bottom: 25px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.2);
      position: relative;
      overflow: hidden;
      color: #e2e8f0;
      z-index: 1;
    }

    .main-well-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 30%, rgba(45,212,191,0.05) 0%, transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(250,204,21,0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 2;
    }

    .main-well-card > * {
      position: relative;
      z-index: 10;
    }

    .well-icon i {
      font-size: 70px;
      color: #2dd4bf;
      filter: drop-shadow(0 0 30px rgba(45, 212, 191, 0.5));
      animation: pulse 2s ease-in-out infinite;
      margin-bottom: 15px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .level-badge {
      display: inline-block;
      background: linear-gradient(135deg, #2dd4bf, #0d9488);
      padding: 8px 25px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 18px;
      color: #0f172a;
      box-shadow: 0 8px 20px rgba(45, 212, 191, 0.3);
      margin-bottom: 15px;
    }

    .production-info {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      padding: 20px;
      margin: 20px 0;
    }

    .production-rate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 28px;
      font-weight: 800;
      color: #2dd4bf;
    }

    .production-rate i {
      font-size: 24px;
    }

    .production-label {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 5px;
    }

    .next-collection {
      background: rgba(45, 212, 191, 0.1);
      border-radius: 20px;
      padding: 15px;
      margin: 15px 0;
      border: 1px dashed #2dd4bf;
    }

    .timer {
      font-size: 32px;
      font-weight: 800;
      color: #fbbf24;
      font-family: monospace;
    }

    .timer-label {
      color: #94a3b8;
      font-size: 12px;
    }

    .referral-cut-info {
      background: rgba(139, 92, 246, 0.15);
      border-radius: 15px;
      padding: 12px 15px;
      margin: 12px 0;
      border: 1px solid rgba(139, 92, 246, 0.3);
      font-size: 13px;
      color: #c4b5fd;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .referral-cut-info i {
      color: #8b5cf6;
      font-size: 18px;
    }

    .collect-btn {
      background: linear-gradient(135deg, #2dd4bf, #0d9488);
      border: none;
      color: #0f172a;
      padding: 18px 30px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 10px 30px rgba(45, 212, 191, 0.4);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .collect-btn:active {
      transform: scale(0.95);
    }

    .collect-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* بطاقات الترقية */
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
    }

    .section-title i {
      color: #fbbf24;
    }

    .upgrade-card {
      background: linear-gradient(145deg, #1e3a5f, #0f3460);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px solid rgba(45, 212, 191, 0.2);
      transition: all 0.2s;
      position: relative;
    }

    .upgrade-card.purchased {
      opacity: 0.7;
      border-color: #10b981;
    }

    .upgrade-card.purchased::after {
      content: '✓';
      position: absolute;
      top: 12px;
      right: 15px;
      width: 25px;
      height: 25px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
    }

    .upgrade-icon {
      width: 55px;
      height: 55px;
      border-radius: 18px;
      background: linear-gradient(145deg, #2dd4bf, #0d9488);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #0f172a;
      flex-shrink: 0;
    }

    .upgrade-info {
      flex: 1;
    }

    .upgrade-name {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 5px;
      color: #f8fafc;
    }

    .upgrade-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .upgrade-benefit {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2dd4bf;
      font-weight: 700;
      font-size: 14px;
    }

    .upgrade-benefit i {
      font-size: 12px;
    }

    .upgrade-price {
      text-align: center;
      flex-shrink: 0;
    }

    .price-value {
      font-weight: 800;
      font-size: 18px;
      color: #fbbf24;
    }

    .price-label {
      font-size: 10px;
      color: #94a3b8;
    }

    .buy-btn {
      background: linear-gradient(135deg, #fbbf24, #d97706);
      border: none;
      color: #0f172a;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      transition: all 0.2s;
    }

    .buy-btn:active {
      transform: scale(0.95);
    }

    .buy-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .purchased-badge {
      color: #10b981;
      font-weight: 700;
      font-size: 13px;
      margin-top: 8px;
    }

    /* سجل الإنتاج */
    .history-section {
      margin-top: 30px;
      padding-bottom: 30px;
    }

    .history-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .history-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .history-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(45, 212, 191, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2dd4bf;
      font-size: 18px;
    }

    .history-details .history-title {
      font-weight: 600;
      margin-bottom: 3px;
    }

    .history-details .history-time {
      font-size: 11px;
      color: #64748b;
    }

    .history-amount {
      font-weight: 800;
      color: #2dd4bf;
      font-size: 18px;
      text-align: left;
    }

    .history-cut {
      font-size: 10px;
      color: #8b5cf6;
      margin-top: 2px;
    }

    /* حالة فارغة */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }

    .empty-state i {
      font-size: 50px;
      opacity: 0.3;
      margin-bottom: 15px;
    }

    /* مودال الآبار الإضافية */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: linear-gradient(145deg, #1a1a2e, #16213e);
      border-radius: 25px;
      padding: 20px;
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid rgba(45, 212, 191, 0.3);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-header h3 {
      font-size: 19px;
      font-weight: 800;
      color: #2dd4bf;
    }

    .close-modal {
      cursor: pointer;
      font-size: 24px;
      color: #94a3b8;
      transition: all 0.2s;
      width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .close-modal:hover {
      color: #ef4444;
      background: rgba(255, 255, 255, 0.05);
    }

    .extra-well-modal-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(45, 212, 191, 0.15);
    }

    .extra-well-modal-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .extra-well-modal-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: linear-gradient(145deg, #2dd4bf, #0d9488);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #0f172a;
      background-size: cover;
      background-position: center;
    }

    .extra-well-modal-name {
      font-weight: 700;
      font-size: 15px;
    }

    .extra-well-modal-stats {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 6px;
    }

    .extra-well-modal-stat i {
      color: #2dd4bf;
      margin-left: 4px;
    }

    .expired-badge {
      background: #ef4444;
      color: white;
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 10px;
      font-weight: 700;
      display: inline-block;
    }

    .active-badge {
      background: #10b981;
      color: white;
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 10px;
      font-weight: 700;
      display: inline-block;
    }

    #toastMsg {
      position: fixed;
      bottom: 30px;
      left: 20px;
      right: 20px;
      background: #1e293b;
      color: white;
      padding: 14px 20px;
      border-radius: 50px;
      text-align: center;
      z-index: 5000;
      opacity: 0;
      transition: 0.25s;
      pointer-events: none;
      max-width: 400px;
      margin: 0 auto;
      font-weight: 600;
    }

    #toastMsg.show {
      opacity: 1;
      bottom: 40px;
    }
.oil-header { display: none !important; } .resources-bar { top: 0 !important; } .oil-container { margin-top: 60px !important; }
    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px;
    }

    .loading-spinner i {
      font-size: 35px;
      color: #2dd4bf;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .particles {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #2dd4bf;
      border-radius: 50%;
      opacity: 0.3;
      animation: float 6s infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(180deg); }
    }
  </style>
</head>
<body>

<!-- هيدر -->
<div class="oil-header">
  <h2><i class="fas fa-oil-well"></i> بئر النفط</h2>
  <div class="header-actions">
    <div class="referral-badge" id="referralBadge" style="display:none;">
      <i class="fas fa-link"></i>
      <span id="referralInfo"></span>
    </div>
    
  </div>
</div>

<!-- شريط الموارد -->
<div class="resources-bar">
  <div class="resource-badge gold">
    <i class="fas fa-coins"></i>
    <span id="goldDisplay">0</span>
  </div>
  <div class="extra-wells-badge" id="extraWellsBadge" onclick="openExtraWellsModal()" style="display:none;">
      <i class="fas fa-oil-can"></i>
      <span id="extraWellsCount">0</span> آبار مطورة
    </div>
  <div class="resource-badge oil">
    <i class="fas fa-oil-can"></i>
    <span id="oilDisplay">0</span>
  </div>
</div>

<!-- المحتوى الرئيسي -->
<div class="oil-container" id="oilContainer">
  <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
</div>

<!-- مودال الآبار الإضافية -->
<div class="modal-overlay" id="extraWellsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3><i class="fas fa-oil-can"></i> الآبار المطورة</h3>
      <div class="close-modal" onclick="closeExtraWellsModal()">
        <i class="fas fa-times"></i>
      </div>
    </div>
    <div id="extraWellsModalContent"></div>
  </div>
</div>

<div id="toastMsg"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCPBrZMo6IYCwCDYV3HEfNcUmLUITR6VRc",
    authDomain: "elahbes.firebaseapp.com",
    projectId: "elahbes",
    storageBucket: "elahbes.firebasestorage.app",
    messagingSenderId: "800207969145",
    appId: "1:800207969145:web:aa19b725d1c92dd48fada8",
    measurementId: "G-EFT566SJMP"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const WELL_LEVELS = {
    0: { name: 'بئر صغير', production: 10, upgradeCost: 0 },
    1: { name: 'بئر متوسط', production: 50, upgradeCost: 100000 },
    2: { name: 'بئر كبير', production: 100, upgradeCost: 1500000 },
    3: { name: 'بئر عملاق', production: 500, upgradeCost: 5000000 }
  };

  const REFERRAL_CUT_PERCENT = 1;

  let currentUser = null;
  let resources = { gold: 10000, oil: 0 };
  let mainWellData = {
    level: 0,
    lastCollection: 0,
    collectionHistory: []
  };
  let extraWells = [];
  let referrerId = null;
  let timerInterval = null;

  function showToast(msg, isSuccess = true) {
    const t = document.getElementById('toastMsg');
    if (!t) return;
    t.textContent = msg;
    t.style.background = isSuccess ? '#10b981' : '#ef4444';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  function formatNumber(num) {
    return num?.toLocaleString('ar-SA') || '0';
  }

  function formatTime(seconds) {
    if (seconds <= 0) return '00:00:00';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function getTimeUntilNextCollection() {
    const now = Date.now();
    const lastCollection = mainWellData.lastCollection || now;
    const elapsed = Math.floor((now - lastCollection) / 1000);
    const cooldown = 24 * 60 * 60;
    const remaining = Math.max(0, cooldown - elapsed);
    return { remaining, canCollect: remaining === 0 };
  }

  function getMainWellProduction() {
    return WELL_LEVELS[mainWellData.level]?.production || 10;
  }

  function getExtraWellsDailyProduction() {
    let total = 0;
    const now = Date.now();
    extraWells.forEach(well => {
      if (!well.expiresAt || well.expiresAt > now) {
        total += well.dailyOil;
      }
    });
    return total;
  }

  function getTotalDailyProduction() {
    return getMainWellProduction() + getExtraWellsDailyProduction();
  }

  function calculateTotalProfit(well) {
    const daysInMonth = 30;
    const totalDays = well.durationMonths * daysInMonth;
    const totalOil = well.dailyOil * totalDays;
    return { totalOil, totalDays };
  }

  function getReferrerFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    const ref = urlParams.get('ref');
    if (ref) {
      localStorage.setItem('referrerId', ref);
      return ref;
    }
    return localStorage.getItem('referrerId') || null;
  }

  async function saveReferralData(uid) {
    const refId = getReferrerFromURL();
    if (refId && refId !== uid) {
      referrerId = refId;
      try {
        await updateDoc(doc(db, "users", uid), {
          referrerId: refId,
          referredAt: Date.now()
        });
        const referrerRef = doc(db, "users", refId);
        const referrerDoc = await getDoc(referrerRef);
        if (referrerDoc.exists()) {
          const referrals = referrerDoc.data().referrals || [];
          if (!referrals.includes(uid)) {
            referrals.push(uid);
            await updateDoc(referrerRef, {
              referrals: referrals,
              totalReferralOil: (referrerDoc.data().totalReferralOil || 0)
            });
          }
        }
        document.getElementById('referralBadge').style.display = 'flex';
        document.getElementById('referralInfo').textContent = 'مسجل عبر إحالة';
      } catch (error) {
        console.error('خطأ في حفظ الإحالة:', error);
      }
    }
  }

  async function loadReferralData(uid) {
    try {
      const userDoc = await getDoc(doc(db, "users", uid));
      if (userDoc.exists()) {
        const data = userDoc.data();
        if (data.referrerId) {
          referrerId = data.referrerId;
          document.getElementById('referralBadge').style.display = 'flex';
          document.getElementById('referralInfo').textContent = 'مسجل عبر إحالة';
        }
      }
    } catch (error) {
      console.error('خطأ في تحميل بيانات الإحالة:', error);
    }
  }

  async function sendReferralCut(collectionAmount) {
    if (!referrerId || !currentUser) return 0;
    const cutAmount = Math.floor(collectionAmount * REFERRAL_CUT_PERCENT / 100);
    if (cutAmount <= 0) return 0;
    try {
      const referrerResourcesRef = doc(db, "resources", referrerId);
      const referrerDoc = await getDoc(referrerResourcesRef);
      if (referrerDoc.exists()) {
        const referrerOil = (referrerDoc.data().oil || 0) + cutAmount;
        const referrerReferralOil = (referrerDoc.data().referralOil || 0) + cutAmount;
        await updateDoc(referrerResourcesRef, {
          oil: referrerOil,
          referralOil: referrerReferralOil
        });
        const referrerUserRef = doc(db, "users", referrerId);
        const referrerUserDoc = await getDoc(referrerUserRef);
        if (referrerUserDoc.exists()) {
          await updateDoc(referrerUserRef, {
            totalReferralOil: (referrerUserDoc.data().totalReferralOil || 0) + cutAmount
          });
        }
        return cutAmount;
      }
    } catch (error) {
      console.error('خطأ في إرسال نسبة الإحالة:', error);
    }
    return 0;
  }

  async function loadUserData(uid) {
    try {
      await loadReferralData(uid);
      const resourcesDoc = await getDoc(doc(db, "resources", uid));
      if (resourcesDoc.exists()) {
        resources = resourcesDoc.data();
        if (resources.gold === undefined) resources.gold = 10000;
      } else {
        resources = { gold: 10000, oil: 0 };
        await setDoc(doc(db, "resources", uid), resources);
      }
      const mainWellDoc = await getDoc(doc(db, "oil_wells", uid));
      if (mainWellDoc.exists()) {
        mainWellData = mainWellDoc.data();
      } else {
        mainWellData = {
          level: 0,
          lastCollection: Date.now(),
          collectionHistory: []
        };
        await setDoc(doc(db, "oil_wells", uid), mainWellData);
      }
      const extraWellsDoc = await getDoc(doc(db, "extra_wells", uid));
      if (extraWellsDoc.exists()) {
        extraWells = extraWellsDoc.data().wells || [];
      } else {
        extraWells = [];
        await setDoc(doc(db, "extra_wells", uid), { wells: [] });
      }
      updateResourcesDisplay();
      updateExtraWellsBadge();
      renderPage();
      startTimer();
    } catch (error) {
      console.error("خطأ في تحميل البيانات:", error);
    }
  }

  function updateResourcesDisplay() {
    document.getElementById('goldDisplay').textContent = formatNumber(resources.gold || 0);
    document.getElementById('oilDisplay').textContent = formatNumber(resources.oil || 0);
  }

  function updateExtraWellsBadge() {
    const now = Date.now();
    const activeCount = extraWells.filter(w => !w.expiresAt || w.expiresAt > now).length;
    const badge = document.getElementById('extraWellsBadge');
    const countSpan = document.getElementById('extraWellsCount');
    if (activeCount > 0) {
      badge.style.display = 'flex';
      countSpan.textContent = activeCount;
    } else {
      badge.style.display = 'none';
    }
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const { remaining, canCollect } = getTimeUntilNextCollection();
      const timerElement = document.getElementById('collectionTimer');
      if (timerElement) {
        timerElement.textContent = formatTime(remaining);
      }
      const collectBtn = document.getElementById('collectMainBtn');
      if (collectBtn) {
        collectBtn.disabled = !canCollect;
      }
    }, 1000);
  }

  window.collectAllWells = async function() {
    const { canCollect } = getTimeUntilNextCollection();
    if (!canCollect) {
      showToast('لم يحن وقت التجميع بعد', false);
      return;
    }
    const now = Date.now();
    const mainProduction = getMainWellProduction();
    let extraProduction = 0;
    const updatedExtraWells = [];
    for (const well of extraWells) {
      if (well.expiresAt && well.expiresAt <= now) {
        updatedExtraWells.push(well);
        continue;
      }
      const lastCollection = well.lastCollection || well.purchasedAt || now;
      const daysPassed = Math.floor((now - lastCollection) / (24 * 60 * 60 * 1000));
      if (daysPassed >= 1) {
        const collectDays = Math.min(daysPassed, 30);
        const wellProduction = collectDays * well.dailyOil;
        extraProduction += wellProduction;
        updatedExtraWells.push({ ...well, lastCollection: now });
      } else {
        updatedExtraWells.push(well);
      }
    }
    const totalCollection = mainProduction + extraProduction;
    if (totalCollection <= 0) {
      showToast('لا يوجد نفط للتجميع حالياً', false);
      return;
    }
    try {
      const referralCut = await sendReferralCut(totalCollection);
      const netOil = totalCollection - referralCut;
      const newOil = (resources.oil || 0) + netOil;
      await updateDoc(doc(db, "resources", currentUser.uid), { oil: newOil });
      const historyEntry = {
        amount: netOil,
        totalCollected: totalCollection,
        referralCut: referralCut,
        mainProduction: mainProduction,
        extraProduction: extraProduction,
        extraWellsCount: extraWells.filter(w => !w.expiresAt || w.expiresAt > now).length,
        level: mainWellData.level,
        timestamp: now
      };
      await updateDoc(doc(db, "oil_wells", currentUser.uid), {
        lastCollection: now,
        collectionHistory: arrayUnion(historyEntry)
      });
      await updateDoc(doc(db, "extra_wells", currentUser.uid), { wells: updatedExtraWells });
      resources.oil = newOil;
      mainWellData.lastCollection = now;
      mainWellData.collectionHistory = [...(mainWellData.collectionHistory || []), historyEntry];
      extraWells = updatedExtraWells;
      updateResourcesDisplay();
      updateExtraWellsBadge();
      renderPage();
      startTimer();
      let msg = `✅ تم تجميع ${formatNumber(netOil)} نفط`;
      if (extraProduction > 0) msg += ` (الأساسي: ${mainProduction} + الإضافي: ${extraProduction})`;
      if (referralCut > 0) msg += ` | تم خصم ${formatNumber(referralCut)} نفط للإحالة`;
      showToast(msg, true);
    } catch (error) {
      console.error("خطأ في التجميع:", error);
      showToast('فشل التجميع', false);
    }
  };

  window.purchaseMainUpgrade = async function(targetLevel) {
    const currentLevel = mainWellData.level || 0;
    if (targetLevel <= currentLevel) {
      showToast('لقد قمت بشراء هذه الترقية مسبقاً', false);
      return;
    }
    if (targetLevel !== currentLevel + 1) {
      showToast('يجب شراء الترقيات بالترتيب', false);
      return;
    }
    const levelInfo = WELL_LEVELS[targetLevel];
    if (!levelInfo) return;
    if (resources.gold < levelInfo.upgradeCost) {
      showToast('رصيد الذهب غير كافٍ', false);
      return;
    }
    try {
      const newGold = resources.gold - levelInfo.upgradeCost;
      await updateDoc(doc(db, "resources", currentUser.uid), { gold: newGold });
      await updateDoc(doc(db, "oil_wells", currentUser.uid), { level: targetLevel });
      resources.gold = newGold;
      mainWellData.level = targetLevel;
      updateResourcesDisplay();
      renderPage();
      startTimer();
      showToast(`تمت الترقية إلى ${levelInfo.name}!`, true);
    } catch (error) {
      console.error("خطأ في الترقية:", error);
      showToast('فشلت الترقية', false);
    }
  };

  window.openExtraWellsModal = function() {
    const modal = document.getElementById('extraWellsModal');
    const content = document.getElementById('extraWellsModalContent');
    const now = Date.now();
    if (extraWells.length === 0) {
      content.innerHTML = `<div class="empty-state"><i class="fas fa-oil-can"></i><p>لا توجد آبار مطورة حتى الآن</p></div>`;
    } else {
      content.innerHTML = extraWells.map(well => {
        const { totalOil } = calculateTotalProfit(well);
        const isExpired = well.expiresAt && well.expiresAt <= now;
        const remainingTime = well.expiresAt ? Math.max(0, well.expiresAt - now) : 0;
        const remainingDays = Math.ceil(remainingTime / (24 * 60 * 60 * 1000));
        return `
          <div class="extra-well-modal-card">
            <div class="extra-well-modal-header">
              <div class="extra-well-modal-icon" style="background-image: url('${well.image}');">
                ${!well.image ? '<i class="fas fa-oil-well"></i>' : ''}
              </div>
              <div>
                <div class="extra-well-modal-name">${well.name}</div>
                <span class="${isExpired ? 'expired-badge' : 'active-badge'}">${isExpired ? 'منتهي' : 'نشط'}</span>
              </div>
            </div>
            <div class="extra-well-modal-stats">
              <div class="extra-well-modal-stat"><i class="fas fa-oil-can"></i> ${formatNumber(well.dailyOil)}/يوم</div>
              <div class="extra-well-modal-stat"><i class="fas fa-coins"></i> ${formatNumber(well.goldPrice)} ذهب</div>
              <div class="extra-well-modal-stat"><i class="fas fa-calendar"></i> ${well.durationMonths} شهر</div>
            </div>
            <div style="margin-top:8px; font-size:12px; color:#94a3b8;">
              <i class="fas fa-hourglass-half"></i> 
              ${isExpired ? 'انتهت المدة' : `متبقي: ${remainingDays} يوم`} | 
              إجمالي الربح: ${formatNumber(totalOil)} نفط
            </div>
            <div style="margin-top:6px; font-size:10px; color:#2dd4bf;">
              <i class="fas fa-link"></i> يضاف إنتاجه تلقائياً للتجميع الموحد
            </div>
          </div>
        `;
      }).join('');
    }
    modal.style.display = 'flex';
  };

  window.closeExtraWellsModal = function() {
    document.getElementById('extraWellsModal').style.display = 'none';
  };

  function renderPage() {
    const container = document.getElementById('oilContainer');
    if (!container) return;
    const mainLevel = mainWellData.level || 0;
    const levelInfo = WELL_LEVELS[mainLevel];
    const mainProduction = getMainWellProduction();
    const extraDailyProduction = getExtraWellsDailyProduction();
    const totalDailyProduction = getTotalDailyProduction();
    const { remaining, canCollect } = getTimeUntilNextCollection();
    const history = mainWellData.collectionHistory || [];
    const particles = Array.from({ length: 12 }, (_, i) => `
      <div class="particle" style="left: ${Math.random() * 100}%; top: ${Math.random() * 100}%; animation-delay: ${Math.random() * 6}s; animation-duration: ${5 + Math.random() * 5}s;"></div>
    `).join('');
    
    container.innerHTML = `
      <div class="main-well-card">
        <div class="particles">${particles}</div>
        <div class="well-icon"><i class="fas fa-oil-well"></i></div>
        <div class="well-level">
          <span class="level-badge"><i class="fas fa-tachometer-alt"></i> ${levelInfo.name}</span>
        </div>
        <div class="production-info">
          <div class="production-rate">
            <i class="fas fa-oil-can"></i>
            <span>${formatNumber(totalDailyProduction)}</span>
          </div>
          <div class="production-label">إجمالي الإنتاج اليومي</div>
          <div style="display:flex; justify-content:center; gap:20px; margin-top:12px; font-size:13px; color:#94a3b8;">
            <span>🏭 الأساسي: ${mainProduction}</span>
            ${extraDailyProduction > 0 ? `<span>🛢️ الإضافي: +${extraDailyProduction}</span>` : ''}
          </div>
        </div>
        ${referrerId ? `
          <div class="referral-cut-info">
            <i class="fas fa-link"></i>
            <span>يتم خصم ${REFERRAL_CUT_PERCENT}% من كل تجميع وتحويلها للمُحيل تلقائياً</span>
          </div>
        ` : ''}
        <div class="next-collection">
          <div class="timer" id="collectionTimer">${formatTime(remaining)}</div>
          <div class="timer-label">متبقي حتى التجميع القادم (موحد لجميع الآبار)</div>
        </div>
        <button class="collect-btn" id="collectMainBtn" onclick="collectAllWells()" ${!canCollect ? 'disabled' : ''}>
          <i class="fas fa-hand-holding"></i>
          ${canCollect ? `تجميع ${formatNumber(totalDailyProduction)} نفط` : 'غير متاح للتجميع'}
        </button>
      </div>
      
      <div class="upgrades-section">
        <div class="section-title">
          <i class="fas fa-arrow-up"></i>
          <span>ترقية البئر الأساسي</span>
        </div>
        ${renderMainUpgradeCards(mainLevel)}
      </div>
      
      <div class="history-section">
        <div class="section-title">
          <i class="fas fa-history"></i>
          <span>سجل التجميع</span>
        </div>
        ${history.length > 0 ? history.slice(-10).reverse().map(item => `
          <div class="history-card">
            <div class="history-info">
              <div class="history-icon"><i class="fas fa-oil-can"></i></div>
              <div class="history-details">
                <div class="history-title">${WELL_LEVELS[item.level]?.name || 'بئر'} ${item.extraProduction > 0 ? `(+${item.extraProduction} إضافي)` : ''}</div>
                <div class="history-time">${new Date(item.timestamp).toLocaleString('ar-SA')}</div>
                ${item.referralCut > 0 ? `<div class="history-cut">🔗 خصم إحالة: -${formatNumber(item.referralCut)}</div>` : ''}
              </div>
            </div>
            <div>
              <div class="history-amount">+${formatNumber(item.amount)} 🛢️</div>
              ${item.referralCut > 0 ? `<div style="font-size:10px; color:#8b5cf6;">الإجمالي: ${formatNumber(item.totalCollected)}</div>` : ''}
            </div>
          </div>
        `).join('') : `
          <div class="empty-state">
            <i class="fas fa-oil-can"></i>
            <p>لا يوجد سجل تجميع بعد</p>
          </div>
        `}
      </div>
    `;
  }

  function renderMainUpgradeCards(currentLevel) {
    const cards = [];
    for (let level = 1; level <= 3; level++) {
      const levelInfo = WELL_LEVELS[level];
      const isPurchased = currentLevel >= level;
      const canAfford = resources.gold >= levelInfo.upgradeCost;
      if (isPurchased && level !== currentLevel) continue;
      cards.push(`
        <div class="upgrade-card ${isPurchased ? 'purchased' : ''}">
          <div class="upgrade-icon">
            <i class="fas fa-${level === 1 ? 'arrow-up' : level === 2 ? 'arrow-trend-up' : 'crown'}"></i>
          </div>
          <div class="upgrade-info">
            <div class="upgrade-name">${levelInfo.name}</div>
            <div class="upgrade-desc">ترقية من ${WELL_LEVELS[level-1]?.name}</div>
            <div class="upgrade-benefit">
              <i class="fas fa-oil-can"></i>
              <span>إنتاج ${levelInfo.production} نفط/يوم</span>
            </div>
          </div>
          <div class="upgrade-price">
            ${!isPurchased ? `
              <div class="price-value">${formatNumber(levelInfo.upgradeCost)}</div>
              <div class="price-label">ذهب</div>
              <button class="buy-btn" onclick="purchaseMainUpgrade(${level})" ${!canAfford ? 'disabled' : ''}>
                ${canAfford ? 'شراء' : 'ذهب غير كافٍ'}
              </button>
            ` : `
              <div class="purchased-badge">
                <i class="fas fa-check-circle"></i> تم الشراء
              </div>
            `}
          </div>
        </div>
      `);
    }
    return cards.join('');
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      await saveReferralData(user.uid);
      await loadUserData(user.uid);
    } else {
      const container = document.getElementById('oilContainer');
      if (container) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-sign-in-alt"></i>
            <p>يرجى تسجيل الدخول للوصول إلى بئر النفط</p>
          </div>
        `;
      }
    }
  });

  window.addEventListener('beforeunload', () => {
    if (timerInterval) clearInterval(timerInterval);
  });
</script>
</body>
</html>
